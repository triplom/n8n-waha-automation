apiVersion: v1
kind: ConfigMap
metadata:
  name: automation-config
  namespace: automation
data:
  # Postgres
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "n8n"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # N8N
  GENERIC_TIMEZONE: "America/Sao_Paulo"
  N8N_LOG_LEVEL: "info"
  N8N_COMMUNITY_PACKAGES_ENABLED: "true"
  N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  # Public URL / proxy settings
  N8N_WEBHOOK_URL: "https://n8n.local/"
  N8N_HOST: "n8n.local"
  N8N_PROTOCOL: "https"
  # Override the editor URL so n8n doesn't append :5678 (internal port)
  N8N_EDITOR_BASE_URL: "https://n8n.local"
  # Disable external JS task runner subprocess (avoids 403 race on startup)
  N8N_RUNNERS_ENABLED: "false"

  # WAHA
  WHATSAPP_DEFAULT_ENGINE: "GOWS"
  WHATSAPP_HOOK_EVENTS: "message"
  # Intra-namespace URL: WAHA → N8N service
  WHATSAPP_HOOK_URL: "http://n8n:5678/webhook/webhook"
  WAHA_NO_API_KEY: "true"
  WAHA_DASHBOARD_NO_PASSWORD: "true"
